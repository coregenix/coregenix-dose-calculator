<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="COREGENIX Dose Calculator — Made by Sant Kumar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="1" stop-color="#150f2e"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".6" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b9cff" stroke-opacity=".07"/>
    </pattern>
    <radialGradient id="glow1" cx=".1" cy=".1" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".95" cy=".2" r=".6"><stop offset="0" stop-color="#a78bfa" stop-opacity=".25"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow2)"/>
  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="21.5" fill="none" stroke="#8b9cff" stroke-opacity=".25"/>

  <!-- logo -->
  <g transform="translate(70 70) scale(2.6)">
    <polygon points="32,5 55.5,18.5 55.5,45.5 32,59 8.5,45.5 8.5,18.5" fill="none" stroke="url(#gv)" stroke-width="2.4" stroke-linejoin="round"/>
    <g stroke="url(#gv)" stroke-width="1.6" stroke-linecap="round" opacity=".75">
      <line x1="26.5" y1="16" x2="37.5" y2="16"/><line x1="26.5" y1="25" x2="37.5" y2="25"/>
      <line x1="26.5" y1="39" x2="37.5" y2="39"/><line x1="26.5" y1="48" x2="37.5" y2="48"/>
    </g>
    <g fill="none" stroke="url(#gv)" stroke-width="3" stroke-linecap="round">
      <path d="M24 10 C24 20 40 20 40 32 S24 44 24 54"/>
      <path d="M40 10 C40 20 24 20 24 32 S40 44 40 54"/>
    </g>
  </g>

  <!-- text -->
  <text x="280" y="108" font-family="'Courier New', monospace" font-size="20" letter-spacing="7" fill="#22d3ee">COREGENIX</text>
  <text x="278" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="700" fill="url(#g)">Dose Calculator</text>
  <text x="280" y="226" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#9aa8c4">How many bottles, bags or vials should we dispense?</text>

  <g font-family="'Courier New', monospace" font-size="15" fill="#c9d4ea">
    <rect x="280" y="254" width="170" height="32" rx="16" fill="none" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="300" y="275">NS · DNS · RL</text>
    <rect x="462" y="254" width="150" height="32" rx="16" fill="none" stroke="#a78bfa" stroke-opacity=".5"/>
    <text x="482" y="275">Pediatric</text>
    <rect x="624" y="254" width="190" height="32" rx="16" fill="none" stroke="#f472b6" stroke-opacity=".5"/>
    <text x="644" y="275">Hours / Minutes</text>
    <text x="840" y="275" fill="#8a97b1">Made by Sant Kumar</text>
  </g>

  <!-- bottles -->
  <g transform="translate(1010 80)" stroke="#22d3ee" stroke-width="2" fill="none">
    <rect x="0" y="20" width="34" height="86" rx="8" stroke-opacity=".7"/>
    <rect x="9" y="12" width="16" height="9" rx="2" fill="#22d3ee" fill-opacity=".6"/>
    <rect x="3" y="40" width="28" height="63" rx="5" fill="url(#gv)" stroke="none" opacity=".85"/>
    <rect x="52" y="20" width="34" height="86" rx="8" stroke-opacity=".7"/>
    <rect x="61" y="12" width="16" height="9" rx="2" fill="#22d3ee" fill-opacity=".6"/>
    <rect x="55" y="40" width="28" height="63" rx="5" fill="url(#gv)" stroke="none" opacity=".85"/>
    <rect x="104" y="20" width="34" height="86" rx="8" stroke-opacity=".7"/>
    <rect x="113" y="12" width="16" height="9" rx="2" fill="#22d3ee" fill-opacity=".6"/>
    <rect x="107" y="78" width="28" height="25" rx="5" fill="url(#gv)" stroke="none" opacity=".85"/>
  </g>
  <text x="1010" y="215" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="url(#g)">4.8 → 5</text>
</svg>
